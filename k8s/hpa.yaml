---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: content-ops-ai
  labels:
    app: content-ops-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: content-ops-ai
  minReplicas: 2
  maxReplicas: 10
  metrics:
    # CPU utilization based scaling
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Custom Pod metric: HTTP requests per second
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "100"
