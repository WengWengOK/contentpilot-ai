---
# =============================================================================
# Secret template - REPLACE placeholder values before deploying to production
# Use `kubectl create secret` or a secrets manager (Sealed Secrets / External Secrets)
# for real deployments. NEVER commit actual secrets to version control.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: content-ops-secret
  labels:
    app: content-ops-ai
type: Opaque
stringData:
  # --- Database credentials ---
  DB_HOST: "postgres.database.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "contentops"
  DB_USER: "contentops"
  DB_PASSWORD: "REPLACE_WITH_ACTUAL_DB_PASSWORD"

  # --- OpenAI API credentials ---
  OPENAI_API_KEY: "REPLACE_WITH_ACTUAL_OPENAI_API_KEY"
  OPENAI_BASE_URL: "https://api.openai.com"

  # --- Langfuse observability credentials ---
  LANGFUSE_HOST: "http://langfuse.observability.svc.cluster.local:3000"
  LANGFUSE_PUBLIC_KEY: "REPLACE_WITH_ACTUAL_LANGFUSE_PUBLIC_KEY"
  LANGFUSE_SECRET_KEY: "REPLACE_WITH_ACTUAL_LANGFUSE_SECRET_KEY"
