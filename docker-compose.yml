version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: contentops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: contentops
      POSTGRES_PASSWORD: password
      POSTGRES_DB: contentops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contentops -d contentops"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - contentops-net

  redis:
    image: redis:7
    container_name: contentops-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - contentops-net

  qdrant:
    image: qdrant/qdrant:v1.8.0
    container_name: contentops-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - contentops-net

  langfuse:
    image: langfuse/langfuse:2
    container_name: contentops-langfuse
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://contentops:password@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: contentops-langfuse-nextauth-secret
      SALT: contentops-langfuse-salt
      DISABLE_TELEMETRY: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - contentops-net

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  contentops-net:
    driver: bridge
